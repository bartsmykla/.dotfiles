#:schema https://smyklot.com/schema/repository-panel-v1.json

disable_bare_commands = false
disable_deleted_comments = true
allow_draft_merges = true

[panel]
version = 1
scope = 'repository'

[panel.settings]
enabled = true

[panel.settings.merge_exceptions]
allow = true

[[panel.settings.merge_exceptions.actors]]
id = 1197525
type = 'Integration'
mode = 'always'

[panel.sync]
[panel.sync.files]
document = '{"merges":[{"path":"renovate.json","strategy":"deep-merge","overrides":{"schedule":["on the first day of the month"],"automerge":false,"automergeStrategy":null,"vulnerabilityAlerts":{"automerge":false},"extends":[":disableRateLimiting",":maintainLockFilesWeekly"],"ignorePaths":["**/knowledge/**","**/secrets/**","**/todos/**"],"nix":{"enabled":true},"customManagers":[{"customType":"regex","datasourceTemplate":"github-releases","depNameTemplate":"stacklok/toolhive-studio","description":"Update ToolHive Studio version and hash in nix","extractVersionTemplate":"^v(?\u003cversion\u003e.*)$","managerFilePatterns":["/^nix/modules/home/toolhive-studio\\.nix$/"],"matchStrings":["version = \"(?\u003ccurrentValue\u003e.*?)\";\\s+src = pkgs\\.fetchurl \\{\\s+url = \"https://github\\.com/stacklok/toolhive-studio/releases/download/v\\$\\{version\\}/ToolHive-arm64\\.dmg\";\\s+sha256 = \"(?\u003ccurrentDigest\u003esha256-[A-Za-z0-9+/=]+|[a-f0-9]{52,64})\";"]}],"packageRules":[{"addLabels":["mise"],"description":"Non-major mise updates","matchManagers":["mise"],"matchUpdateTypes":["minor","patch"]}]},"arrays":[{"path":"$.extends","strategy":"append"},{"path":"$.ignorePaths","strategy":"append"},{"path":"$.packageRules","strategy":"append"}]}]}'
