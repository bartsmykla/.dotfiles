#:schema https://smyklot.com/schema/repository-panel-v1.json

disable_bare_commands = false
disable_deleted_comments = true
allow_draft_merges = true

[panel]
version = 1
scope = 'repository'

[panel.settings]
enabled = true

[panel.settings.merge_exceptions]
allow = true

[[panel.settings.merge_exceptions.actors]]
id = 1197525
type = 'Integration'
mode = 'always'

[panel.sync]
[panel.sync.files]
document = '{"merges":[{"path":"renovate.json","strategy":"deep-merge","overrides":{"schedule":["on the first day of the month"],"automerge":false,"automergeStrategy":null,"vulnerabilityAlerts":{"automerge":false},"extends":[":disableRateLimiting",":maintainLockFilesWeekly"],"ignorePaths":["**/knowledge/**","**/secrets/**","**/todos/**"],"nix":{"enabled":true},"customManagers":[{"customType":"regex","datasourceTemplate":"github-releases","depNameTemplate":"NousResearch/hermes-agent","description":"Update the pinned Hermes Agent release and its commit in nix","extractVersionTemplate":"^(?\u003cversion\u003ev\\d+\\.\\d+\\.\\d+)$","managerFilePatterns":["/^nix/modules/home/hermes\\.nix$/"],"matchStrings":["rev = \"(?\u003ccurrentDigest\u003e[a-f0-9]{40})\"; # (?\u003ccurrentValue\u003ev[0-9][^\\s]*)"]}],"packageRules":[{"addLabels":["mise"],"description":"Non-major mise updates","matchManagers":["mise"],"matchUpdateTypes":["minor","patch"]}]},"arrays":[{"path":"$.extends","strategy":"append"},{"path":"$.ignorePaths","strategy":"append"},{"path":"$.packageRules","strategy":"append"}]}]}'
